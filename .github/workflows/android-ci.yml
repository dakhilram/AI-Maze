name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Refresh Android command-line tools
        run: |
          OLD_SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -n "$OLD_SDKMANAGER"
          yes | "$OLD_SDKMANAGER" --licenses >/dev/null || true
          "$OLD_SDKMANAGER" "cmdline-tools;latest"

      - name: Install Android 37 platform
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --update || true
          "$SDKMANAGER" --list | grep "platforms;android-37" || true
          "$SDKMANAGER" "platforms;android-37"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests and debug build
        run: ./gradlew test assembleDebug --no-daemon
